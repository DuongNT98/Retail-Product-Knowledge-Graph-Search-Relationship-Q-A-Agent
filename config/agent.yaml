# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors).
id: "RET-C2-566"
name: "Retail Product Knowledge Graph Search & Relationship Q&A Agent"
namespace: "ret"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. The intended deployment shape wires a real
# answer-LLM (AZURE_OPENAI_*). The deterministic answer body remains a valid
# fallback on its own (docs/02_design.md DDR) when the LLM is unavailable —
# but a CONFIGURED-but-broken LLM still surfaces as status=error (never a
# silent fallback), per RET-C2-566's own reviewed POST-02 R2 contract.
generation_mode: "llm"
industry: "RET"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "VectorRAGAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.RETProductKnowledgeGraphSearchAgent"

# Security
required_trust_level: "INTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# AZURE_OPENAI_* is declared (unlike the generic-HTTP predecessor it replaces): this
# deployment's intended shape always has the answer-LLM configured (generation_mode:
# "llm" above); a totally-absent secret set still degrades to the deterministic answer
# at the node level (never crashes an invoke), but require_at_compile() hard-failing an
# unconfigured deployment is the correct signal here, not a contradiction — see
# _resolve_llm in the main node for the runtime tri-state (unset / partially-set /
# broken) that governs silent-fallback vs status=error per invocation.
requires:
  secrets: ["PRODUCT_KG_API_KEY", "PRODUCT_KG_BASE_URL", "AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI

# generation_mode is deployment identity, not a tunable provider setting. Runtime parameters
# (max_retry, timeout_s, hitl, memory_enabled, ...) live in
# config/config.yaml — AgentRegistry loads that file separately and passes it
# as Graph(config=...). Do NOT put them here.
